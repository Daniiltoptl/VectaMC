name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-14
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lld
      - name: Check server
        shell: bash
        run: set -o pipefail; cargo check --locked --workspace 2>&1 | tee ci-check.log
      - name: Test workspace
        shell: bash
        run: set -o pipefail; cargo test --locked --workspace 2>&1 | tee ci-test.log
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: python3 scripts/ci_annotate.py ci-*.log || python scripts/ci_annotate.py ci-*.log

  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-14
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y lld
      - name: Format
        run: set -o pipefail; cargo fmt --all --check 2>&1 | tee ci-fmt.log
      - name: Clippy
        run: set -o pipefail; cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee ci-clippy.log
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: python3 scripts/ci_annotate.py ci-*.log || python scripts/ci_annotate.py ci-*.log

  tooling:
    name: Reference tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p "test_*.py" -v

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">VectaMC</title>
  <desc id="desc">A Minecraft server in Rust, built toward vanilla parity.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#132c35"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#8df5bb"/><stop offset="1" stop-color="#39b6d8"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7bdab2" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>
  <path d="M80 76h42l42 100 42-100h42l-65 148h-38z" fill="url(#accent)"/>
  <text x="292" y="151" fill="#f1f8f5" font-family="Segoe UI,Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-3">VectaMC</text>
  <text x="296" y="194" fill="#a4c0c3" font-family="Segoe UI,Arial,sans-serif" font-size="22">Rust foundation. Vanilla ambition.</text>
  <rect x="916" y="110" width="204" height="78" rx="12" fill="#8df5bb" fill-opacity=".07" stroke="#8df5bb" stroke-opacity=".22"/>
  <text x="1018" y="140" text-anchor="middle" fill="#8df5bb" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2">JAVA EDITION</text>
  <text x="1018" y="171" text-anchor="middle" fill="#edf9f5" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600">26.3</text>
</svg>
